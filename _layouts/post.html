---
layout: default
---

<div style="margin-left: 0; margin-right: 0;"> <!-- Remove left-right margin -->
  <div class="row"> <!-- Remove justify-content-center to allow full width -->
    <div class="col-12"> <!-- Use full width column -->
      <div class="row g-5 mb-5">
        <div class="col-12">
          <h2 class="border-bottom pb-3 mb-5">{{ page.title }}</h2>
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      processEscapes: true
    }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>
