- title: "Optimizing for Representation Learning"
  description: >-
    This project explores algorithms that split model training into two parts: learning representations (i.e. Phi) 
    and learning task heads (i.e. F^(t)). The work is motivated by the fact that classical methods don't work well in this setting. 
    Tap here to see a one page description written by the lead of this project Thomas Zhang.
  short_description: >-
    This project explores algorithms that split model training into two parts: learning representations (i.e. Phi) 
