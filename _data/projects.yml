- title: "Optimizing for Representation Learning"
  description: >-
    The grand success of Deep Learning is often attributed to large models' ability to learn representations of data
    suitable for more classical (or just simpler) machine learning methods take as input down stream. This project 
    explores alternative algorithms that split learning representations maps (i.e. Phi) and learning task heads (i.e. F^(t)) into 
    two seperate problems since classical methods break down or don't work well in this setting.
  short_description: >-
    This project explores algorithms that split model training into two parts: learning representations (i.e. Phi) 
    and learning task heads (i.e. F^(t)). The work is motivated by the fact that classical methods don't work well in this setting.
  image: "/images/repl.png"
  link: "/pdfs/Optimizing_for_representation_learning.pdf"
  current: true

