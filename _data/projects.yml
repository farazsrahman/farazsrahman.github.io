- title: "Model-Based Learning for Locomotion"
  description: >-
    Working on an extension of the DIAL-MPC paper which used sampling-based MPC and a lot of compute to perform
    legged locomotion tasks training-free. Our team is interested in incorporating learning to the algorithm
    to reduce its computational demands. The goal is to test sim2real on the Unitree Go2 quadruped  platform.
  short_description: >-
    Working on an extension of the DIAL-MPC paper which used sampling-based MPC and a lot of compute to perform
    legged locomotion tasks training-free. Our team is interested in incorporating learning into the algorithm
    to reduce its computational demands. The goal is to test sim2real on the Unitree Go2 quadruped  platform.
