- title: "SwiftScore"
  description: >-
    I worked on early engineering for SwiftScore - the world's first Assignment Management Platform. The product is a SaaS tool 
    that aims to save teachers time using AI-assisted grading, analytics, and remediation tools all in one. While engineering, 
    I worked on integrating the Google Classroom API into our application. I am still involved with the company, although 
    I now work on product and strategy.

  image: "/images/swiftscore.png"
  link: "https://swiftscore.org"
  current: true


- title: "Decision Making Diffusion Models"
  description: >-
    Thinking of DDPMS as a stochastic process, we explore how different time intervals in the diffusion 
    trajectory affect the features/structure that show up in the final sample. More importantly, I learned to 
    train large models on (multiple) GPUs, got my toes wet with generative modeling theory, and made a lot of
    cool friends while working on this project in Prof. Eric Wong's Brachio Lab under Anton Xue during my Sophomore summer.
  image: "/images/diffusion.png"
  link: "/project/2024/10/19/decision-making-diffusion-models.html"
  current: true



- title: "TyPorch - C++ ML Compiler"
  description: >-
     TyPorch began as means for me to learn how ML works  beyond model.fit() after my freshman Big Data course, 
     but unintentionally became my first interaction with optimization algorithms, high performance (parallel)
     computing, C++, and shaped many of my interests throughout the rest of my time at Penn. I was able
     to train moderately sized (10k parameter) feedforward models on toy data, but never finished working all
     the way through benchmarking on the  MNIST dataset.

  image: "/images/typorch.png"
  link: "https://github.com/farazsrahman/TyPorch"
  current: true


