- title: "Model-Based Learning for Locomotion"
  description: >-
    I am currently working on an extension of the DIAL-MPC paper which uses sampling-based optimization
    and a lot of compute to perform legged locomotion tasks training-free. Our team is interested in 
    incorporating learning into the algorithm to reduce its computational demands. 
    The goal is to test sim2real on the Unitree Go2 quadruped platform.
  short_description: >-
    I am currently working on an extension of the DIAL-MPC paper which uses sampling-based optimization
    and a lot of compute to perform legged locomotion tasks training-free. Our team is interested in 
    incorporating learning into the algorithm to reduce its computational demands. 
    The goal is to test sim2real on the Unitree Go2 quadruped platform.
  image: "/images/mujoco_dog.png"
  link: "/pdfs/fetch.pdf"
  current: false

- title: "Layer-wise Preconditioners & Provable Feature Learning"
  description: >-
    Recent excitement around layer-wise preconditioners (e.g. Shampoo, SOAP) had grown due to 
    strong performance in online competitions such as AlgoPerf. We pose the question of *why* these methods perform well
    and answer them by studying linear representation learning which naive SGD catastrophically fails on. 
    This project was lead by Thomas Zhang and featured in ICML 2025.
  short_description: >-
    We study layer-wise preconditioners in a (seemingly benign) setting where SGD fails and derive principled insights into their effectiveness. 
    This project was lead by Thomas Zhang and featured at ICML 2025.
  image: "/images/SSSweepKFAC.png"
  link: "https://arxiv.org/abs/2502.01763"
  current: true

- title: "SwiftScore"
  description: >-
    I worked on early engineering for SwiftScore - the world's first Assignment Management Platform. The product is a SaaS tool 
    that aims to save teachers time using AI-assisted grading, analytics, and remediation tools all in one. While on the engineering team, 
    I worked on integrating Google Classroom API into our application, and coordinated bi-weekly sprints. 

  short_description: >-
    I worked on product design and engineering for SwiftScore - an AI EdTech Platform. My contributions include 
    integrating Google Classroom, designing the Assignment Bank, and scaling the engineering team.
  image: "/images/swiftscore.png"
  link: "https://swiftscore.org"
  current: true


- title: "Decision Making Diffusion Models"
  description: >-
    Thinking of DDPMS as a stochastic process, we explore how different time intervals in the diffusion 
    trajectory affect the features structure that shows up in the final sample. More importantly, I learned to 
    train large models on (multiple) GPUs, got my toes wet with generative modeling theory, and made a lot of
    cool friends while working on this project in Prof. Eric Wong's Brachio Lab under Anton Xue during my Sophomore summer.
  short_description: >-
    Given a diffusion trajectory and some set of features in the final sample, can we ascribe a timeline for feature generation using 
    some form of mechanistic interpretability? Considering the variance of a final sample of the diffusion process conditioned on intermediate points, we answer yes.
  image: "/images/butterfly.gif"
  link: "decision-making-diffusion-models"
  current: true



- title: "TyPorch"
  description: >-
     TyPorch began as means for me to learn how ML works  beyond model.fit() after my freshman Big Data course, 
     but unintentionally became my first interaction with optimization algorithms, high performance (parallel)
     computing, C++, and shaped many of my interests throughout the rest of my time at Penn. I was able
     to train moderately sized (10k parameter) feedforward models on toy data, but never finished working all
     the way through benchmarking on the  MNIST dataset.

  short_description: >-
     This is a homebrewed C++ deep learning compiler that lets you design your own sequential models and run optimization 
     algorithms such as stochastic gradient descent. Check out the repo for more!

  image: "/images/typorch.png"
  link: "https://github.com/farazsrahman/TyPorch"
  current: true


