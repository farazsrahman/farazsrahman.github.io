- title: "Model-Based Learning for Locomotion"
  description: >-
    I am currently working on an extension of the DIAL-MPC paper which uses sampling-based optimization
    and a lot of compute to perform legged locomotion tasks training-free. Our team is interested in 
    incorporating learning into the algorithm to reduce its computational demands. 
    The goal is to test sim2real on the Unitree Go2 quadruped platform.
  short_description: >-
    I am currently working on an extension of the DIAL-MPC paper which uses sampling-based optimization
    and a lot of compute to perform legged locomotion tasks training-free. Our team is interested in 
    incorporating learning into the algorithm to reduce its computational demands. 
    The goal is to test sim2real on the Unitree Go2 quadruped platform.
  image: "/images/mujoco_dog.png"
  link: "/pdfs/fetch.pdf"
  current: false

- title: "Optimizing for Representation Learning"
  description: >-
    This project explores algorithms that split model training into two parts: learning representations (i.e. Phi) 
    and learning task heads (i.e. F^(t)). The work is motivated by the fact that classical methods don't work well in this setting. 
    Tap here to see a one page description written by the lead of this project Thomas Zhang.
  short_description: >-
    It's easy to forget the optimization and learning are not the same thing. This project explores algorithms that 
    can learn representations of data provably better than SGD.
  image: "/images/repl.png"
  link: "/pdfs/Optimizing_for_representation_learning.pdf"
  current: true

- title: "SwiftScore"
  description: >-
    I worked on early engineering for SwiftScore - the world's first Assignment Management Platform. The product is a SaaS tool 
    that aims to save teachers time using AI-assisted grading, analytics, and remediation tools all in one. While on the engineering team, 
    I worked on integrating the Google Classroom API into our application, and coordinated bi-weekly sprints. 

  short_description: >-
    I worked on early product design and engineering for SwiftScore - an AI-assisted EdTech Platform. My contributions include 
    integrating the Google Classroom, the Assignment Bank, and scaling the engineering team.
  image: "/images/swiftscore.png"
  link: "https://swiftscore.org"
  current: true


- title: "Decision Making Diffusion Models"
  description: >-
    Thinking of DDPMS as a stochastic process, we explore how different time intervals in the diffusion 
    trajectory affect the features structure that shows up in the final sample. More importantly, I learned to 
    train large models on (multiple) GPUs, got my toes wet with generative modeling theory, and made a lot of
    cool friends while working on this project in Prof. Eric Wong's Brachio Lab under Anton Xue during my Sophomore summer.
  image: "/images/diffusion.png"
  link: "/project/2024/10/19/decision-making-diffusion-models.html"
  current: false



- title: "TyPorch - C++ ML Compiler"
  description: >-
     TyPorch began as means for me to learn how ML works  beyond model.fit() after my freshman Big Data course, 
     but unintentionally became my first interaction with optimization algorithms, high performance (parallel)
     computing, C++, and shaped many of my interests throughout the rest of my time at Penn. I was able
     to train moderately sized (10k parameter) feedforward models on toy data, but never finished working all
     the way through benchmarking on the  MNIST dataset.

  image: "/images/typorch.png"
  link: "https://github.com/farazsrahman/TyPorch"
  current: false


